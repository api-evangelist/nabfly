name: nabfly
description: 'nabfly, Inc., doing business as Bespoke Post, is a New York City-based
  direct-to-consumer e-commerce and subscription retailer founded in 2011 and backed
  by 500 Global. It sells rugged-meets-refined menswear and lifestyle gear, designing
  its own brands (including Line of Trade, Fieldworth, Halfday, Wren, Ash and Fir,
  and Marcellin) and curating products from small independent makers. Alongside a
  standard online store, it runs an optional membership offering member pricing, early
  access, and curated monthly boxes. The company operates as a consumer retail brand
  at bespokepost.com and does not publish a public developer API, SDK, or developer
  portal; this profile captures its identity, public web properties, and domain-security
  posture.'
